  <text class="t" x="48" y="92">Kaynaklar</text>
  <text class="s" x="48" y="122">Belediyeler</text><text class="s" x="48" y="146">Bilet platformu</text><text class="s" x="48" y="170">Spor federasyonu</text><text class="s" x="48" y="194">Mekân takvimleri</text><text class="s" x="48" y="218">Organizatörler</text><text class="s" x="48" y="242">Yerel rehberler</text>

  <rect class="b" x="218" y="60" width="150" height="220" rx="10"/>
  <text class="t" x="234" y="92">Adaptörler</text>
  <text class="s" x="234" y="122">Kaynak kaydı</text><text class="s" x="234" y="146">Zamanlayıcı</text><text class="s" x="234" y="170">robots.txt kontrolü</text><text class="s" x="234" y="194">Hata kaydı</text><text class="s" x="234" y="218">Ham veri arşivi</text>

  <rect class="g" x="404" y="60" width="170" height="220" rx="10"/>
