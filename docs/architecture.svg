<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-label="EventOps veri akışı: kamuya açık kaynaklar, veri toplama, işleme, SQLite, API ve web arayüzü">
  <style>
    .t{font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
    .s{font:400 12px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
    .h{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#047857;letter-spacing:.06em}
    .b{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
    .g{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}
    .a{stroke:#10b981;stroke-width:2;fill:none;marker-end:url(#m)}
  </style>
  <defs><marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#10b981"/></marker></defs>
  <rect width="1120" height="330" rx="14" fill="#f8fafc"/>
  <text class="h" x="32" y="42">TOPLAMA</text><text class="h" x="400" y="42">İŞLEME</text><text class="h" x="800" y="42">SUNUM</text>

